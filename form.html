<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <link rel="stylesheet" href="form.css">
</head>
<body>
    <h1 id="h1">Form</h1>
    <div id="form1">
        <label for="username">Enter your name: </label>
        <input type="text" name="username" placeholder="Enter your name" id="username"><br><br>
        <label for="password">Enter your password: </label>
        <input type="password" name="password" placeholder="Enter your password" id="password"><br><br>
        <label for="email">Enter your email: </label>
        <input type="email" name="email" placeholder="Enter your email" id="email"><br><br>
        <label for="age">Enter your age: </label>
        <input type="number" name="age" placeholder="Enter your age" id="age"><br><br>
        <label for="dob">Enter your date of birth: </label>
        <input type="date" name="dob" id="dob"><br><br>
        <p>Enter your gender:</p>
        <label for="male">Male</label>
        <input type="radio" name="gender" id="male" value="male">
        <label for="female">Female</label>
        <input type="radio" name="gender" id="female" value="female"><br><br>
        <label for="subscribe">Subscribe Please</label>
        <input type="checkbox" name="subscribe" id="subscribe"><br>
        <label for="country">Select your country: </label>
        <select name="country" id="country">
            <option value="india">India</option>
            <option value="usa">USA</option>
            <option value="uk">UK</option>
        </select><br><br>
         <label for="text">Enter text:  </label>
         <textarea name="text" id="text" rows="4" cols="40" placeholder="Enter your text here"></textarea><br><br>

    </div>
</body>
</html>
